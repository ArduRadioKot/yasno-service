services:
  postgres:
    image: postgres:15-alpine
    container_name: eduapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: edu_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - eduapp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edu_app"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  eduapp_pgdata:
